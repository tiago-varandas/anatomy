<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neuron bench</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.iso{
  --nb-fluid:#3a3a3a;--nb-fluid-top:#4a4a4a;--nb-fluid-side:#333333;--nb-fluid-dark:#2c2c2c;
  --nb-hot:#e8e8e8;--nb-hot-top:#ffffff;--nb-hot-side:#cfcfcf;
  --nb-window:#0c0c0c;--nb-digits:#d4d4d4;
}
.iso[data-theme="light"]{
  --nb-fluid:#dcdcd8;--nb-fluid-top:#e8e8e4;--nb-fluid-side:#d2d2ce;--nb-fluid-dark:#c8c8c4;
  --nb-hot:#2a2a2e;--nb-hot-top:#4a4a4e;--nb-hot-side:#1c1c1f;
  --nb-window:#26262a;--nb-digits:#f4f4f1;
}
.nb-stage{position:relative;outline:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.nb-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.nb-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* fluid columns: a tint of the figure's own inks, lit while the cell spikes */
.nb-fluid .iso-fill{fill:var(--nb-fluid)}
.nb-fluid .iso-top{fill:var(--nb-fluid-top)}
.nb-fluid .iso-shade{fill:var(--nb-fluid-side)}
.nb-fluid .iso-shade[data-shade="0"]{fill:var(--nb-fluid-dark)}
.nb-fluid .iso-fill,.nb-fluid .iso-top,.nb-fluid .iso-shade{transition:fill 260ms var(--anatomy-ease)}
.nb-fluid[data-hot] .iso-fill,.nb-fluid[data-hot] .iso-shade{fill:var(--nb-hot-side)}
.nb-fluid[data-hot] .iso-top{fill:var(--nb-hot-top)}
.nb-fluid[data-hot] .iso-edge{stroke:var(--anatomy-lit)}
.nb-glint{opacity:.9}

/* a pulse running down an axon lights the chunks it is passing through */
.it[data-route] .tb-body,.it[data-route] .tb-shine,.it[data-route] .tb-shade{transition:fill 180ms var(--anatomy-ease)}
.it[data-hot] .tb-body{fill:var(--nb-hot-side)}
.it[data-hot] .tb-shine{fill:var(--nb-hot-top)}
.it[data-hot] .tb-shade{fill:var(--nb-hot)}
.it[data-hot] .tb-edge{stroke:var(--anatomy-lit)}

/* a synapse lights as its pulse passes and when it learns */
.nb-valve .iso-shade,.nb-valve .iso-top,.nb-valve .iso-fill{transition:fill 220ms var(--anatomy-ease)}
.nb-valve[data-hot] .iso-fill,.nb-valve[data-hot] .iso-shade{fill:var(--nb-hot-side)}
.nb-valve[data-hot] .iso-top{fill:var(--nb-hot-top)}
.nb-valve[data-hot] .iso-edge{stroke:var(--anatomy-lit)}
.nb-needle{stroke-width:1.1}
.it[data-learn] .nb-needle{stroke:var(--anatomy-lit)}

.nb-key{cursor:pointer;transition:transform 140ms var(--anatomy-ease)}
.nb-window{fill:var(--nb-window);stroke:var(--anatomy-lo);stroke-width:.3}
.nb-digits{fill:var(--nb-digits);font-family:var(--anatomy-mono);font-variant-numeric:tabular-nums;letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.nb-fluid .iso-fill,.nb-fluid .iso-top,.nb-fluid .iso-shade,.it[data-route] .tb-body,.nb-key{transition:none}}

ses, on roughly 20 watts. The bench runs 50 times slower than life.</span></figcaption></figure><style>.credit{margin:40px 0 0;color:var(--anatomy-muted);font:11px/1.4 var(--anatomy-mono);letter-spacing:.04em}.credit a{color:var(--anatomy-text);text-decoration:none;border-bottom:1px solid var(--anatomy-faint)}.credit a:hover{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}</style><p class="credit">Made by <a href="https://www.littlenicethings.com/">Studio Little Nice Things</a> · <a href="https://buymeacoffee.com/littlenicethings">Support future experiments ☕️</a></p></main><script type="module">const AZIMUTH = 45;

`;
// The one model behind the neuron bench: every level, pulse, valve turn, readout and caption number
// comes from here. Times are in milliseconds of neuron time, voltages in millivolts.

const NEURON = {
  rest: -70, // resting membrane potential
  threshold: -55, // the axon hillock fires at about −55 mV
  peak: 40, // top of the action potential
  ahp: -80, // after-hyperpolarisation, below rest
  tauM: 20, // membrane leak time constant
  tauS: 1, // synaptic current time constant
  rise: 0.5, // spike upstroke
  fall: 1, // spike downstroke to the after-hyperpolarisation
  refractory: 2, // absolute refractory period
};

const SYN = {
  names: ["food", "bell", "light"],
  start: [20, 5, 5], // synaptic weights in mV of injected charge
  max: 20,
  plus: 4.5, // potentiation when the input arrives before the output spike (STDP)
  minus: 2.2, // depression when it arrives after
  tau: 20, // STDP time constant
  window: 40, // beyond this the pairing no longer counts
};

const DELAY = { axon: 6, out: 5 }; // conduction time of the input lines and of D's own axon
const STIM = 24; // charge a sense organ puts into its own neuron per stimulus
const SLOW = 50; // the bench runs 50 times slower than a real neuron: 1 s on screen is 20 ms

function makeNeuron() {
  return { v: NEURON.rest, q: 0, spikeAt: -1e9, from: NEURON.rest };
}

function makeNet() {
  return { t: 0, n: [makeNeuron(), makeNeuron(), makeNeuron(), makeNeuron()], w: [...SYN.start], arrived: [-1e9, -1e9, -1e9], pulses: [], out: [], count: 0, fired: [-1e9, -1e9, -1e9, -1e9], learned: [0, 0, 0] };
}

const smooth = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));

// Advance one neuron by h ms; returns true on the step it fires.
function stepNeuron(n, t, h) {
  const age = t - n.spikeAt;
  if (age < NEURON.rise) {
    n.v = n.from + (NEURON.peak - n.from) * smooth(age / NEURON.rise);
    return false;
  }
  if (age < NEURON.rise + NEURON.fall) {
    n.v = NEURON.peak + (NEURON.ahp - NEURON.peak) * smooth((age - NEURON.rise) / NEURON.fall);
    return false;
  }
  const inject = n.q * (1 - Math.exp(-h / NEURON.tauS));
  n.q -= inject;
  n.v += inject + (NEURON.rest - n.v) * (1 - Math.exp(-h / NEURON.tauM));
  if (n.v >= NEURON.threshold && age >= NEURON.refractory) {
    n.spikeAt = t;
    n.from = n.v;
    n.q = 0;
    return true;
  }
  return false;
}

function stimulate(net, index) {
  net.n[index].q += STIM;
}

// Advance the whole bench by dt ms in sub-steps of at most 0.05 ms.
function stepNet(net, dt) {
  const steps = Math.max(1, Math.ceil(dt / 0.05));
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    net.t += h;
    const t = net.t;
    for (let i = 0; i < 3; i++) {
      if (stepNeuron(net.n[i], t, h)) {
        net.fired[i] = t;
        net.pulses.push({ line: i, at: t, done: false });
      }
    }
    for (const pulse of net.pulses) {
      if (pulse.done || t - pulse.at < DELAY.axon) continue;
      pulse.done = true;
      const i = pulse.line;
      net.n[3].q += net.w[i];
      net.arrived[i] = t;
      const late = t - net.fired[3];
      if (late >= 0 && late <= SYN.window) {
        net.w[i] = Math.max(0, net.w[i] - SYN.minus * Math.exp(-late / SYN.tau));
        net.learned[i] = t;
      }
    }
    if (stepNeuron(net.n[3], t, h)) {
      net.fired[3] = t;
      net.out.push({ at: t, done: false });
      for (let i = 0; i < 3; i++) {
        const lead = t - net.arrived[i];
        if (lead >= 0 && lead <= SYN.window) {
          const before = net.w[i];
          net.w[i] = Math.min(SYN.max, net.w[i] + SYN.plus * Math.exp(-lead / SYN.tau));
          if (net.w[i] !== before) net.learned[i] = t;
        }
      }
    }
    for (const spike of net.out) {
      if (spike.done || t - spike.at < DELAY.out) continue;
      spike.done = true;
      net.count++;
    }
  }
  net.pulses = net.pulses.filter((pulse) => !pulse.done || net.t - pulse.at < DELAY.axon + 2);
  net.out = net.out.filter((spike) => !spike.done || net.t - spike.at < DELAY.out + 2);
}

const DATA = {"P":{"origin":[287.78096707645136,251.86317324532425],"scale":1.1390855960329995,"azimuth":58,"elevation":30},"slow":50,"tanks":[{"cx":-125,"cy":-38,"zb":6,"g0":11},{"cx":-125,"cy":38,"zb":6,"g0":11},{"cx":-125,"cy":0,"zb":6,"g0":11},{"cx":96,"cy":0,"zb":18,"g0":23}],"valves":[{"along":263.67,"x":22,"y":-38,"top":21.095200000000002,"r":7.5},{"along":263.67,"x":22,"y":38,"top":21.095200000000002,"r":7.5},{"along":263.67,"x":22,"y":0,"top":21.095200000000002,"r":7.5}],"routes":{"axon0":{"total":311.67},"axon1":{"total":311.67},"axon2":{"total":311.67},"axonD":{"total":157.62}},"fluidR":7,"range":[-90,50]};
const PJ = DATA.P;
const stage = document.querySelector(".nb-stage");
const svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const status = stage.querySelector("[data-status]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const NAMES = ["food", "bell", "light"];

const fluids = [];
svg.querySelectorAll("[data-fluid]").forEach((el) => (fluids[+el.dataset.fluid] = el));
const chunksOf = (route) => [...svg.querySelectorAll(`.it[data-route="${route}"]`)].map((el) => ({ el, from: +el.dataset.from, to: +el.dataset.to, hot: false }));
const lines = [0, 1, 2].map((i) => chunksOf(`axon${i}`));
const outLine = chunksOf("axonD");
const valves = [];
svg.querySelectorAll("[data-valve]").forEach((el) => (valves[+el.dataset.valve] = el));
const keys = [];
svg.querySelectorAll("[data-key]").forEach((el) => (keys[+el.dataset.key] = el));
const counter = svg.querySelector("[data-count]");
const needles = DATA.valves.map((v, i) => {
  const item = svg.querySelector(`.it[data-name="syn${i}.dial"]`);
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("class", "iso-line nb-needle");
  path.setAttribute("data-tone", "hi");
  path.setAttribute("data-free", "end");
  item.appendChild(path);
  return { item, path, shown: SYN.start[i], drawn: null };
});

const zOf = (t, v) => t.zb + 8 + ((v - DATA.range[0]) / (DATA.range[1] - DATA.range[0])) * 72;
const SPAN = 1.5 * Math.PI;
const FROM = -0.75 * Math.PI;
function needleD(i, w) {
  const v = DATA.valves[i];
  const a = FROM + (Math.max(0, Math.min(SYN.max, w)) / SYN.max) * SPAN;
  const s = Math.sin(a);
  const c = Math.cos(a);
  return lineOnTop([v.x + s * 1.3, v.y - c * 1.3], [v.x + s * v.r, v.y - c * v.r], v.top + 0.15, PJ);
}

let net = makeNet();
const drawnZ = [null, null, null, null];
let queue = [];
let label = "rest";
let action = null;
let resetting = false;
let pressed = [-1e9, -1e9, -1e9];
let clock = 0;
let tourClock = 0;
let touring = !still.matches;
let idleTimer = 0;
let frame = 0;
let last = 0;
let visible = false;

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}
function announce(text) {
  status.textContent = text;
  stage.setAttribute("aria-valuetext", text);
}

function stim(i) {
  stimulate(net, i);
  pressed[i] = clock;
}
function act(kind) {
  if (kind === "reset") {
    resetting = true;
    label = "reset";
    action = null;
    announce("Synapses reset: food 20, bell 5, light 5 mV.");
    return;
  }
  resetting = false;
  if (kind === "pair") {
    stim(1);
    queue.push({ at: net.t + 2, i: 0 });
  } else stim(kind);
  const pairs = kind === "pair" ? (action && action.kind === "pair" ? action.pairs + 1 : 1) : 0;
  label = kind === "pair" ? `bell + food ${pairs}` : `${NAMES[kind]} alone`;
  if (kind === 0) label = "food";
  action = { kind, pairs, t: net.t, spikes: net.count, fired: net.fired[3], said: false };
}

// The idle tour: control stimuli, the unconditioned response, four pairings, the test, the control again.
const TOUR = [
  [0.2, "reset"],
  [1.6, 2],
  [4.2, 1],
  [6.8, 0],
  [9.4, "pair"],
  [12.0, "pair"],
  [14.6, "pair"],
  [17.2, "pair"],
  [20.0, 1],
  [22.6, 2],
];
const TOUR_LENGTH = 25.4;
let tourIndex = 0;

function outcome() {
  if (!action) return "";
  const fired = net.fired[3] > action.t;
  if (fired) return " · D fires";
  if (net.t - action.t > 14) return " · no spike";
  return "";
}

function draw(dt) {
  const t = net.t;
  // fluid columns
  DATA.tanks.forEach((tank, i) => {
    const v = net.n[i].v;
    const z = zOf(tank, v);
    if (drawnZ[i] === null || Math.abs(drawnZ[i] - z) > 0.04) {
      drawnZ[i] = z;
      fluids[i].innerHTML = solidSvg(cylinder(tank.cx, tank.cy, DATA.fluidR, tank.g0 + 0.3, z - tank.g0 - 0.3, PJ, 40), { tone: "hi" });
    }
    const hot = t - net.fired[i] < 7;
    if (hot !== fluids[i].hasAttribute("data-hot")) fluids[i].toggleAttribute("data-hot", hot);
  });
  // pulses along the axons
  const light = (chunks, s0, s1) => chunks.forEach((c) => (c.want = c.want || (c.to > s0 && c.from < s1)));
  lines.forEach((chunks) => chunks.forEach((c) => (c.want = false)));
  outLine.forEach((c) => (c.want = false));
  const valveHot = [false, false, false];
  for (const pulse of net.pulses) {
    const share = (t - pulse.at) / DELAY.axon;
    if (share > 1.08) continue;
    const total = DATA.routes[`axon${pulse.line}`].total;
    const s = Math.min(1, share) * total;
    light(lines[pulse.line], s - 16, s + 0.5);
    if (Math.abs(s - DATA.valves[pulse.line].along) < 10) valveHot[pulse.line] = true;
  }
  for (const spike of net.out) {
    const share = (t - spike.at) / DELAY.out;
    if (share > 1.08) continue;
    const s = Math.min(1, share) * DATA.routes.axonD.total;
    light(outLine, s - 14, s + 0.5);
  }
  for (const chunks of [...lines, outLine])
    for (const c of chunks)
      if (c.want !== c.hot) {
        c.hot = c.want;
        c.el.toggleAttribute("data-hot", c.hot);
      }
  // synapse dials: the needle follows the weight like a gauge (0.25 s), and lights when it learns
  needles.forEach((n, i) => {
    n.shown = still.matches ? net.w[i] : n.shown + (net.w[i] - n.shown) * (1 - Math.exp(-dt / 0.25));
    if (Math.abs(n.shown - net.w[i]) < 0.01) n.shown = net.w[i];
    if (n.drawn === null || Math.abs(n.drawn - n.shown) > 0.005) {
      n.drawn = n.shown;
      n.path.setAttribute("d", needleD(i, n.shown));
    }
    const learning = t - net.learned[i] < 14 || Math.abs(n.shown - net.w[i]) > 0.05;
    if (learning !== n.item.hasAttribute("data-learn")) n.item.toggleAttribute("data-learn", learning);
    const hot = valveHot[i] || learning;
    if (hot !== valves[i].hasAttribute("data-hot")) valves[i].toggleAttribute("data-hot", hot);
  });
  // keys
  keys.forEach((el, i) => {
    const down = clock - pressed[i] < 0.22;
    const want = down ? translateAlong(PJ, [0, 0, -1.4]) : "";
    if ((el.getAttribute("transform") || "") !== want) {
      if (want) el.setAttribute("transform", want);
      else el.removeAttribute("transform");
    }
  });
  const text = String(net.count % 1000).padStart(3, "0");
  if (counter.textContent !== text) counter.textContent = text;
  const result = outcome();
  say(`${label}${result} · bell ${net.w[1].toFixed(1)} mV`);
  if (action && result && !action.said) {
    action.said = true;
    announce(`${label}${result}. Bell synapse ${net.w[1].toFixed(1)} millivolts.`);
  }
}

function quiet() {
  return !queue.length && !resetting && net.pulses.length === 0 && net.out.length === 0 && net.n.every((n) => Math.abs(n.v - NEURON.rest) < 0.05 && Math.abs(n.q) < 0.01) && needles.every((n, i) => n.shown === net.w[i]) && clock - Math.max(...pressed) > 0.3;
}

function advance(simDt) {
  let left = simDt;
  while (left > 0) {
    const next = queue.length ? Math.min(...queue.map((q) => q.at)) - net.t : Infinity;
    const step = Math.min(left, Math.max(0.01, next));
    stepNet(net, step);
    left -= step;
    queue = queue.filter((q) => {
      if (q.at <= net.t + 1e-6) {
        stimulate(net, q.i);
        pressed[q.i] = clock;
        return false;
      }
      return true;
    });
  }
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  if (touring) {
    tourClock += dt;
    while (tourIndex < TOUR.length && tourClock >= TOUR[tourIndex][0]) act(TOUR[tourIndex++][1]);
    if (tourClock >= TOUR_LENGTH) {
      tourClock = 0;
      tourIndex = 0;
    }
  }
  if (resetting) {
    net.w = net.w.map((w, i) => w + (SYN.start[i] - w) * (1 - Math.exp(-dt / 0.45)));
    if (net.w.every((w, i) => Math.abs(w - SYN.start[i]) < 0.01)) {
      net.w = [...SYN.start];
      resetting = false;
    }
  }
  advance((dt * 1000) / DATA.slow);
  draw(dt);
  frame = visible && (touring || !quiet()) ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

// Under reduced motion an action plays out at once: the result, not the animation.
function settleNow() {
  advance(60);
  needles.forEach((n, i) => (n.shown = net.w[i]));
  if (resetting) {
    net.w = [...SYN.start];
    resetting = false;
  }
  draw(1);
}

function user(kind) {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    tourClock = 0;
    tourIndex = 0;
    run();
  }, 9000);
  act(kind);
  if (still.matches) settleNow();
  else run();
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("keydown", (event) => {
  const map = { 1: 0, 2: 1, 3: 2 };
  let kind = null;
  if (event.key in map) kind = map[event.key];
  if (event.key === " " || event.key === "Enter") kind = "pair";
  if (event.key === "r" || event.key === "R" || event.key === "Escape") kind = "reset";
  if (kind === null) return;
  event.preventDefault();
  user(kind);
});
keys.forEach((el, i) =>
  el.addEventListener("click", (event) => {
    event.stopPropagation();
    stage.focus({ preventScroll: true });
    user(i);
  }),
);
stage.addEventListener("focus", () => announce(`${label}. Bell synapse ${net.w[1].toFixed(1)} millivolts, food ${net.w[0].toFixed(1)}, light ${net.w[2].toFixed(1)}.`));
draw(0);
